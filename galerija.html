<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>R.WOOD.B | Galerija</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #faf8f3;
            color: #2c2b28;
            scroll-behavior: smooth;
            line-height: 1.5;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header / navigācija */
        .header {
            background: #ffffff;
            border-bottom: 1px solid #e8e0d2;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(2px);
            background-color: rgba(255, 255, 255, 0.98);
            box-shadow: 0 2px 15px rgba(0,0,0,0.03);
        }

        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 16px 0;
        }

        .logo h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #4a3729;
        }

        .logo .brand-accent {
            color: #b87c4a;
            font-weight: 800;
        }

        .logo p {
            font-size: 0.8rem;
            color: #8b7358;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .nav-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .nav-btn {
            text-decoration: none;
            background: #4a3729;
            color: white;
            padding: 10px 26px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .nav-btn i {
            font-size: 0.95rem;
        }

        .nav-btn:hover {
            background: #b87c4a;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(184,124,74,0.25);
        }

        .nav-btn.active {
            background: #b87c4a;
            box-shadow: 0 4px 12px rgba(184,124,74,0.3);
        }

        /* Galerijas režģis - tikai bildes */
        .gallery-grid-section {
            padding: 40px 0 60px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
        }

        /* Galerijas kartīte */
        .gallery-item {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.08);
            transition: all 0.35s ease;
            background: #ffffff;
            border: 1px solid #efe5d8;
        }

        .gallery-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 35px -12px rgba(0,0,0,0.2);
            border-color: #e2d4c4;
        }

        .gallery-img-wrapper {
            position: relative;
            overflow: hidden;
            aspect-ratio: 4 / 3;
        }

        .gallery-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover .gallery-img-wrapper img {
            transform: scale(1.05);
        }

        /* Modal logs */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .modal-content {
            max-width: 85%;
            max-height: 85%;
            border-radius: 24px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s ease;
            background: #faf8f3;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-img {
            width: auto;
            max-width: 100%;
            max-height: 70vh;
            border-radius: 20px 20px 0 0;
            display: block;
            margin: 0 auto;
        }

        .close-modal {
            position: absolute;
            top: 28px;
            right: 38px;
            color: #f1f1f1;
            font-size: 42px;
            font-weight: bold;
            transition: 0.2s;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-modal:hover {
            color: #b87c4a;
            background: rgba(0,0,0,0.8);
        }

        .modal-caption {
            display: none;
        }

        @media (max-width: 750px) {
            .nav-wrapper {
                flex-direction: column;
                gap: 18px;
                text-align: center;
            }
            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .close-modal {
                top: 15px;
                right: 20px;
                width: 40px;
                height: 40px;
                font-size: 30px;
            }
            .modal-content {
                max-width: 95%;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="container">
        <div class="nav-wrapper">
            <div class="logo">
               <a href="https://rwoodb.github.io" style="text-decoration: none; color: inherit;">
    <h1><span class="brand-accent">R.WOOD.B</span></h1>
    <p>🌲 Saunas un mini mājas</p>
</a>
            </div>
            <div class="nav-buttons">
                <a href="galerija.html" class="nav-btn active"><i class="fas fa-images"></i> Galerija</a>
                <a href="katalogs.html" class="nav-btn"><i class="fas fa-archive"></i> Katalogs</a>
                <a href="kontakti.html" class="nav-btn"><i class="fas fa-phone"></i> Kontakti</a>
            </div>
        </div>
    </div>
</header>

<!-- Galerijas režģis - tikai bildes -->
<section class="gallery-grid-section">
    <div class="container">
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>
</section>

<!-- Modal logs attēlu palielināšanai -->
<div id="imageModal" class="modal">
    <span class="close-modal">&times;</span>
    <div style="display: flex; justify-content: center; align-items: center; flex-direction: column; max-width: 90vw; max-height: 90vh;">
        <img class="modal-img" id="modalImage" src="" alt="Galerijas attēls">
    </div>
</div>

<script>
    // Galerijas dati - tikai attēli, bez apraksta
    const galleryItems = [
        { id: 1, imageUrl: "2.png" },
        { id: 2, imageUrl: "3.png" },
        { id: 3, imageUrl: "4.png" },
        { id: 4, imageUrl: "5.png" },
        { id: 5, imageUrl: "6.png" },
        { id: 6, imageUrl: "7.png" },
        { id: 7, imageUrl: "8.png" },
        { id: 8, imageUrl: "9.png" },
        { id: 9, imageUrl: "10.png" }
    ];

    function renderGallery() {
        const galleryContainer = document.getElementById("galleryGrid");
        if (!galleryContainer) return;
        
        let html = '';
        galleryItems.forEach(item => {
            html += `
                <div class="gallery-item" data-id="${item.id}">
                    <div class="gallery-img-wrapper">
                        <img src="${item.imageUrl}" alt="Galerijas attēls" loading="lazy">
                    </div>
                </div>
            `;
        });
        
        galleryContainer.innerHTML = html;
        
        // Pievienot klikšķu eventus katrai galerijas kartītei, lai atvērtu modālo logu
        document.querySelectorAll('.gallery-item').forEach(card => {
            card.addEventListener('click', (e) => {
                const itemId = parseInt(card.getAttribute('data-id'));
                const foundItem = galleryItems.find(i => i.id === itemId);
                if (foundItem) {
                    openModal(foundItem);
                }
            });
        });
    }
    
    // Atvērt modālo logu tikai ar attēlu
    function openModal(item) {
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImage");
        
        modalImg.src = item.imageUrl;
        modalImg.alt = "Galerijas attēls";
        
        modal.style.display = "flex";
        document.body.style.overflow = "hidden";
    }
    
    // Modāļa aizvēršana
    const modal = document.getElementById("imageModal");
    const closeModalBtn = document.querySelector(".close-modal");
    
    function closeModalFunc() {
        modal.style.display = "none";
        document.body.style.overflow = "auto";
    }
    
    if (closeModalBtn) {
        closeModalBtn.addEventListener("click", closeModalFunc);
    }
    
    window.addEventListener("click", (e) => {
        if (e.target === modal) {
            closeModalFunc();
        }
    });
    
    // Sākotnējā renderēšana
    renderGallery();
</script>

</body>
</html>
